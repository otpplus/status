# Maintained by hand for otpplus/status (SEC-1222), based on Upptime v1.44.1.
# The organisation keeps GITHUB_TOKEN read-only by default, so this workflow
# grants itself the write scopes it needs. Endpoint URLs come from repository
# secrets referenced as $NAME in .upptimerc.yml. Uptime and Response Time must
# name each one in SECRETS_CONTEXT: passing toJson(secrets) whole leaves the
# run in action_required with no jobs.

name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Graphs CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Generate graphs
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ github.token }}
