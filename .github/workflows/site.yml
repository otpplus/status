# Maintained by hand for otpplus/status (SEC-1222), based on Upptime v1.44.1.
# The organisation keeps GITHUB_TOKEN read-only by default, so this workflow
# grants itself the write scopes it needs. Endpoint URLs come from repository
# secrets referenced as $NAME in .upptimerc.yml. Uptime and Response Time must
# name each one in SECRETS_CONTEXT: passing toJson(secrets) whole leaves the
# run in action_required with no jobs.

name: Static Site CI
on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".upptimerc.yml"
      - "assets/**"
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Static Site CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
