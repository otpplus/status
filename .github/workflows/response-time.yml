# Maintained by hand for otpplus/status (SEC-1222), based on Upptime v1.44.1.
# The organisation keeps GITHUB_TOKEN read-only by default, so this workflow
# grants itself the write scopes it needs. Endpoint URLs come from repository
# secrets referenced as $NAME in .upptimerc.yml.

name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  release:
    name: Response Time CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
