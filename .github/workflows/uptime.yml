# Maintained by hand for otpplus/status (SEC-1222), based on Upptime v1.44.1.
# The organisation keeps GITHUB_TOKEN read-only by default, so this workflow
# grants itself the write scopes it needs. Endpoint secrets are listed in
# .upptimerc.yml under `secrets:` and must match SECRETS_CONTEXT below.

name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  release:
    name: Uptime CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"SECURIFY_APP_HEALTH_URL":${{ toJson(secrets.SECURIFY_APP_HEALTH_URL) }},"SECURIFY_API_HEALTH_URL":${{ toJson(secrets.SECURIFY_API_HEALTH_URL) }},"OTP_PLUS_APP_HEALTH_URL":${{ toJson(secrets.OTP_PLUS_APP_HEALTH_URL) }}}'
