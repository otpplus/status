# Public status page for Securify and OTP+ (SEC-1222).
# Live at https://status.securification.ai — checks every 5 minutes from GitHub Actions.
#
# Every checked URL except the public website lives in a repository secret
# ($NAME below) so no internal hostname, health route or version string
# appears on the page, in the README, in this file or in the Actions logs.
# The status page shows only the service name and whether it is up. Adding a
# check: `gh secret set NAME -R otpplus/status`, reference it here, and name
# it in SECRETS_CONTEXT of uptime.yml and response-time.yml (see OPERATING.md).
#
# The workflows in .github/workflows are maintained by hand: the organisation
# keeps GITHUB_TOKEN read-only by default, so each workflow grants itself the
# write scopes it needs, and the template self-update workflows are disabled.

owner: otpplus
repo: status
user-agent: otpplus-status

sites:
  - name: Securify app
    slug: securify-app
    url: $SECURIFY_APP_HEALTH_URL
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://securification.ai/securify-logo.png
  - name: Securify protection service
    slug: securify-protection
    url: $SECURIFY_API_HEALTH_URL
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://securification.ai/securify-logo.png
  - name: Securify website
    slug: securify-website
    url: https://securification.ai
    maxResponseTime: 8000
    icon: https://securification.ai/securify-logo.png
  - name: OTP+ app
    slug: otp-plus-app
    url: $OTP_PLUS_APP_HEALTH_URL
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://cdn.shopify.com/app-store/listing_images/9cbbac2d0d1c5dd670248065e8861510/icon/CMv9l_nJx5QDEAE=.png
  - name: OTP+ one-time code delivery
    slug: otp-plus-code-delivery
    url: $OTP_PLUS_GATEWAY_URL
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://cdn.shopify.com/app-store/listing_images/9cbbac2d0d1c5dd670248065e8861510/icon/CMv9l_nJx5QDEAE=.png

# GITHUB_TOKEN cannot edit repository settings or delete issues.
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
skipDeleteIssues: true

status-website:
  cname: status.securification.ai
  logoUrl: https://securification.ai/securify-logo.png
  favicon: https://securification.ai/securify-logo.png
  name: Securify & OTP+ Status
  theme: light
  introTitle: "Live status of **Securify** and **OTP+**"
  introMessage: >-
    We check both apps every 5 minutes. If something is not working, you will
    see it here first, with updates until it is fixed. Planned maintenance is
    posted here before it starts. Need help? Chat with us inside the app or
    email [dev@otp.plus](mailto:dev@otp.plus).
  navbar:
    - title: Status
      href: /
    - title: Help center
      href: https://help.securification.ai/en/
    - title: Security
      href: https://securification.ai/security
